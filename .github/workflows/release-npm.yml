# Publishes the Pairling npm packages with provenance via npm Trusted
# Publishing (OIDC). No npm tokens exist anywhere in this pipeline.
#
# Custody model: the Developer ID private key never leaves the release Mac.
# Binaries are built, signed, and notarized locally, uploaded as GitHub
# Release assets, and their SHA-256 digests are committed to
# RELEASE-BINARIES.json in the tagged commit. This job verifies the assets
# against the committed digests and the pinned Apple Team ID, assembles the
# packages from the mirrored sources, and publishes. Provenance therefore
# attests the exact commit whose committed digests pin the binaries.
name: release-npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0). The version must not already exist on npm.
        required: true
        type: string
      channel:
        description: npm dist-tag. This workflow only ever publishes to "next"; promote "latest" with the product repo gated promote-npm-latest.sh after device proof.
        required: false
        default: next
        type: choice
        options:
          - next

permissions: {}

env:
  PAIRLING_TEAM_ID: 965AVD34A3

jobs:
  publish:
    runs-on: macos-15
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Verify publishing repository identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, os, sys
          expected = "33abebc9c629f9877e31b8c9f39670427ad5055d80ccdc8a51588101087a042a"
          canonical = "github.com/" + os.environ["REPOSITORY"].strip().casefold()
          if hashlib.sha256(canonical.encode()).hexdigest() != expected:
              sys.exit("refusing to publish from a repository outside the allowlist")
          PY

      - name: Check out release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (OIDC trusted publishing support)
        run: npm install -g npm@11.6.2 && npm --version

      - name: Download signed binaries from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p dist/assets
          gh release download "$TAG" --pattern 'pairling-connectd-*' --dir dist/assets
          gh release download "$TAG" --pattern 'pairling-python-*.tar.gz' --dir dist/assets
          gh release download "$TAG" --pattern 'NOTARIZATION-RECEIPTS.json' --dir dist/assets
          chmod 755 dist/assets/pairling-connectd-arm64 dist/assets/pairling-connectd-x64

      - name: Verify assets against committed release evidence
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 mac/packaging/npm-release-evidence.py verify \
            --evidence RELEASE-BINARIES.json \
            --version "${TAG#v}" \
            --mirror-source-root "$PWD" \
            --connectd-arm64 dist/assets/pairling-connectd-arm64 \
            --connectd-x64 dist/assets/pairling-connectd-x64 \
            --python-arm64 dist/assets/pairling-python-arm64.tar.gz \
            --python-x64 dist/assets/pairling-python-x64.tar.gz \
            --notarization-receipts dist/assets/NOTARIZATION-RECEIPTS.json

      - name: Assemble packages from mirrored sources
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # CI passes pre-signed connectd AND python as prebuilts; the build
          # never re-vendors or re-signs (no Developer ID cert in CI).
          bash mac/packaging/build-npm-packages.sh \
            --release \
            --version "${TAG#v}" \
            --release-evidence RELEASE-BINARIES.json \
            --prebuilt-arm64 dist/assets/pairling-connectd-arm64 \
            --prebuilt-x64 dist/assets/pairling-connectd-x64 \
            --prebuilt-python-arm64 dist/assets/pairling-python-arm64.tar.gz \
            --prebuilt-python-x64 dist/assets/pairling-python-x64.tar.gz
          cat dist/npm/SHASUMS256.txt

      - name: Publish with provenance (runtime packages first, meta last)
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION="${TAG#v}"
          # FAIL-CLOSED dist-tag policy. This workflow publishes ONLY to `next`.
          # `latest` is never produced by this workflow. Promote it from the
          # product repo with mac/packaging/promote-npm-latest.sh after the
          # release gate and on-device proof pass.
          if [ "$EVENT_NAME" = "release" ]; then
            # A release event must be a GitHub pre-release. A normal (non-pre)
            # release implies intent to ship latest, which this workflow refuses:
            # fail closed and force promotion through the gated product repo script.
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "::error::Refusing to publish: GitHub Release is not a pre-release. This workflow only publishes to next; promote latest with mac/packaging/promote-npm-latest.sh after the release gate and device proof pass." >&2
              exit 1
            fi
            CHANNEL="next"
          else
            CHANNEL="${DISPATCH_CHANNEL:-next}"
          fi
          # Hard guard: never publish to anything but next, whatever computed it.
          if [ "$CHANNEL" != "next" ]; then
            echo "::error::Refusing to publish to dist-tag '$CHANNEL'. This workflow only publishes to next; latest is promoted with mac/packaging/promote-npm-latest.sh after release gates pass." >&2
            exit 1
          fi
          echo "publishing channel: $CHANNEL"
          ensure_unpublished() {
            local pkg="$1" out err status
            out="$(mktemp)"
            err="$(mktemp)"
            if npm view "$pkg@$VERSION" version --json >"$out" 2>"$err"; then
              echo "::error::$pkg@$VERSION is already published. Bump the release version and create a new tag." >&2
              rm -f "$out" "$err"
              exit 1
            else
              status=$?
              if ! grep -Eq 'E404|No match found' "$err"; then
                echo "::error::Could not verify npm registry state for $pkg@$VERSION" >&2
                cat "$err" >&2
                rm -f "$out" "$err"
                exit "$status"
              fi
            fi
            rm -f "$out" "$err"
          }
          publish_new() {
            local pkg="$1" tarball="$2"
            ensure_unpublished "$pkg"
            echo "publishing $pkg@$VERSION --tag $CHANNEL"
            npm publish "$tarball" --provenance --access public --tag "$CHANNEL"
          }
          publish_new "@pairling/runtime-claude-darwin-arm64" "dist/npm/pairling-runtime-claude-darwin-arm64-$VERSION.tgz"
          publish_new "@pairling/runtime-claude-darwin-x64" "dist/npm/pairling-runtime-claude-darwin-x64-$VERSION.tgz"
          publish_new "@pairling/runtime-copilot-darwin-arm64" "dist/npm/pairling-runtime-copilot-darwin-arm64-$VERSION.tgz"
          publish_new "@pairling/runtime-copilot-darwin-x64" "dist/npm/pairling-runtime-copilot-darwin-x64-$VERSION.tgz"
          publish_new "@pairling/runtime-darwin-arm64" "dist/npm/pairling-runtime-darwin-arm64-$VERSION.tgz"
          publish_new "@pairling/runtime-darwin-x64" "dist/npm/pairling-runtime-darwin-x64-$VERSION.tgz"
          publish_new "pairling" "dist/npm/pairling-$VERSION.tgz"
